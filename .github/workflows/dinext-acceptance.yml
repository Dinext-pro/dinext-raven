name: Dinext acceptance
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dinext-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cypress:
    name: Cypress acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: main
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install bench and browser libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            mariadb-client libmariadb-dev libmariadb-dev-compat \
            libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools \
            libgtk-3-0t64 libgbm1 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Install ephemeral bench and run unit tests
        env:
          CI: "true"
          DINEXT_DEPLOY_ENABLED: "false"
          DINEXT_NOTIFICATIONS_ENABLED: "false"
          DINEXT_DOCS_AGENT_ENABLED: "0"
          DINEXT_WIKI_PUBLISH_ENABLED: "0"
        run: python ci-support/.github/ci/bench_tests.py "$GITHUB_WORKSPACE"
      - name: Serve the CI site
        run: |
          set -euo pipefail
          bench="$RUNNER_TEMP/dinext-test-bench"
          cd "$bench"
          ./env/bin/bench use ci.test
          echo "127.0.0.1 ci.test" | sudo tee -a /etc/hosts >/dev/null
          nohup ./env/bin/bench serve --port 8000 >"$RUNNER_TEMP/bench-serve.log" 2>&1 &
          nohup node apps/frappe/socketio.js >"$RUNNER_TEMP/socketio.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null "http://ci.test:8000/login"; then
              exit 0
            fi
            sleep 2
          done
          echo "bench serve did not open /login" >&2
          cat "$RUNNER_TEMP/bench-serve.log" >&2 || true
          exit 1
      - name: Run Desk widget Cypress scenarios
        working-directory: ui-tests
        env:
          CYPRESS_BASE_URL: http://ci.test:8000
          CYPRESS_adminPassword: ci-admin
          CYPRESS_ADMIN_PASSWORD: ci-admin
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock mocha-junit-reporter@2.2.1
          mkdir -p results
          npx cypress run --browser electron \
            --spec cypress/e2e/kommunikacii-vidzhet-desk.cy.js \
            --reporter mocha-junit-reporter \
            --reporter-options "mochaFile=results/widget.xml,toConsole=true" \
            --config pageLoadTimeout=120000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cypress-acceptance
          path: |
            ui-tests/results/widget.xml
            ui-tests/cypress/screenshots/**
          if-no-files-found: ignore
          retention-days: 14
